# Nginx Production Hardened Configuration
# Protecciones anti-inyección, anti-scraping, anti-DoS y cabeceras de seguridad estrictas

# Zonas de Rate Limiting para prevenir ataques DoS / Brute Force
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=30r/s;

# Formato de log de seguridad detallado
log_format security_log '$remote_addr - $remote_user [$time_local] "$request" '
                        'status=$status body_bytes=$body_bytes_sent '
                        'host="$http_host" agent="$http_user_agent" '
                        'x_forwarded_for="$http_x_forwarded_for"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 6000 default_server;
    listen [::]:6000 default_server;
    server_name _ floreina.filocentraldemando.site *.filocentraldemando.site;

    root /usr/share/nginx/html;
    index index.html;

    # Ocultar la versión de Nginx (Anti-fingerprinting)
    server_tokens off;

    # Logs de acceso y auditoría de seguridad
    access_log /dev/stdout security_log;
    error_log /dev/stderr warn;

    # Ajuste de buffers de cabeceras para prevenir Error 400 en navegadores y proxys inversos
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    client_max_body_size 10m;
    large_client_header_buffers 4 16k;

    # Timeout estrictos para mitigar ataques Slowloris
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 15s;

    # Aplicar Rate Limiting global
    limit_req zone=global_limit burst=50 nodelay;

    # Cabeceras de Seguridad Extremas (Security Best Practices OWASP)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # Restringir Métodos HTTP (Permitir GET, HEAD, POST)
    if ($request_method !~ ^(GET|HEAD|POST)$ ) {
        return 405;
    }

    # Bloquear User-Agents de escáneres maliciosos
    if ($http_user_agent ~* (sqlmap|nikto|wpscan|dirbuster|gobuster|nmap|masscan|havij|acunetix|nessus|absinthe|netsparker) ) {
        return 403;
    }

    # Bloquear acceso a archivos sensibles (.git, .env, .yaml, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(yml|yaml|json|conf|config|env|sh|bash|md|log|git|bak|sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Ruta principal estática
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché segura para assets estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
