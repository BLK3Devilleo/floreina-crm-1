# Configuración de logs detallados para depuración en Dokploy
log_format custom_debug '$remote_addr - $remote_user [$time_local] "$request" '
                        'status=$status body_bytes=$body_bytes_sent '
                        'host="$http_host" uri="$uri" req_uri="$request_uri"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 6000 default_server;
    listen [::]:6000 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Habilitar logs hacia stdout y stderr para verlos en el panel de Dokploy
    access_log /dev/stdout custom_debug;
    error_log /dev/stderr debug;

    # Cabeceras de seguridad HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para recursos estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
